[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-finetuning-pipeline"
version = "1.0.0"
description = "Production-grade LLM Fine-Tuning Pipeline with QLoRA/LoRA"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "LLM Fine-Tuning Pipeline Contributors", email = "contributors@example.com"}
]
maintainers = [
    {name = "ML Engineering Team", email = "ml-team@example.com"}
]
keywords = [
    "llm", "fine-tuning", "qlora", "lora", "peft", "transformers",
    "huggingface", "pytorch", "mlops", "training", "evaluation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.3.1,<2.4",
    "torchvision>=0.18.1,<0.19",
    "torchaudio>=2.3.1,<2.4",
    "transformers>=4.41.2,<4.42",
    "accelerate>=0.31.0,<0.32",
    "peft>=0.11.1,<0.12",
    "trl>=0.9.4,<0.10",
    "datasets>=2.19.1,<2.20",
    "tokenizers>=0.19.1,<0.20",
    "huggingface-hub>=0.23.2,<0.24",
    "safetensors>=0.4.3,<0.5",
    "bitsandbytes>=0.43.3,<0.44",
    "evaluate>=0.4.2,<0.5",
    "rouge-score>=0.1.2,<0.2",
    "sacrebleu>=2.4.1,<2.5",
    "bert-score>=0.3.13,<0.4",
    "nltk>=3.8.1,<3.9",
    "scipy>=1.13.0,<1.14",
    "scikit-learn>=1.5.0,<1.6",
    "tensorboard>=2.16.2,<2.17",
    "wandb>=0.17.4,<0.18",
    "mlflow>=2.14.1,<2.15",
    "pydantic>=2.7.4,<2.8",
    "pydantic-settings>=2.3.4,<2.4",
    "pyyaml>=6.0.1,<6.1",
    "python-dotenv>=1.0.1,<1.1",
    "rich>=13.7.1,<14",
    "tqdm>=4.66.4,<4.67",
    "numpy>=1.26.4,<1.27",
    "pandas>=2.2.2,<2.3",
    "matplotlib>=3.8.4,<3.9",
    "seaborn>=0.13.2,<0.14",
    "plotly>=5.22.0,<5.23",
    "aiohttp>=3.9.5,<3.10",
    "httpx>=0.27.0,<0.28",
    "fastapi>=0.111.0,<0.112",
    "uvicorn>=0.29.0,<0.30",
    "pydantic-extra-types>=2.8.0,<2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2,<8.3",
    "pytest-cov>=5.0.0,<5.1",
    "pytest-mock>=3.14.0,<3.15",
    "pytest-asyncio>=0.23.7,<0.24",
    "pytest-xdist>=3.5.0,<3.6",
    "ruff>=0.5.0,<0.6",
    "black>=24.4.2,<24.5",
    "mypy>=1.10.0,<1.11",
    "pre-commit>=3.7.1,<3.8",
    "ipython>=8.25.0,<8.26",
    "jupyter>=1.0.0,<1.1",
    "jupyterlab>=4.2.2,<4.3",
    "notebook>=7.1.2,<7.2",
]
flash-attn = [
    "flash-attn>=2.5.8,<2.6",
]
awq = [
    "autoawq>=0.2.5,<0.3",
]
gptq = [
    "auto-gptq>=0.7.1,<0.8",
]
llamacpp = [
    "llama-cpp-python>=0.2.70,<0.3",
]
deploy = [
    "docker>=7.0.0,<7.1",
    "kubernetes>=30.0.0,<31",
    "prometheus-client>=0.19.0,<0.20",
]
all = [
    "flash-attn>=2.5.8,<2.6",
    "autoawq>=0.2.5,<0.3",
    "auto-gptq>=0.7.1,<0.8",
    "llama-cpp-python>=0.2.70,<0.3",
    "docker>=7.0.0,<7.1",
    "kubernetes>=30.0.0,<31",
    "prometheus-client>=0.19.0,<0.20",
]

[project.urls]
Homepage = "https://github.com/your-org/llm-finetuning-pipeline-lora"
Repository = "https://github.com/your-org/llm-finetuning-pipeline-lora"
Issues = "https://github.com/your-org/llm-finetuning-pipeline-lora/issues"
Documentation = "https://github.com/your-org/llm-finetuning-pipeline-lora/docs"
Changelog = "https://github.com/your-org/llm-finetuning-pipeline-lora/blob/main/CHANGELOG.md"

[project.scripts]
train = "src.train:main"
evaluate = "src.evaluate:main"
inference = "src.inference:main"
prepare-data = "src.data_pipeline:main"
merge-adapter = "src.model_utils:merge_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = [
    ".venv",
    "venv",
    "env",
    "dist",
    "build",
    "*.egg-info",
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "logs",
    "checkpoints",
    "adapters",
    "outputs",
    "artifacts",
    "runs",
    "data",
    "notebooks",
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function calls in argument defaults
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PIE", # flake8-pie
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
]
[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "SLF001"]
"src/config.py" = ["TC001", "TC002"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.venv
  | venv
  | env
  | dist
  | build
  | \.git
  | __pycache__
  | \.mypy_cache
  | \.ruff_cache
  | \.pytest_cache
  | logs
  | checkpoints
  | adapters
  | outputs
  | artifacts
  | runs
  | data
  | notebooks
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports = "normal"
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "src.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=90",
    "-v",
    "--tb=short",
]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "smoke: Smoke tests",
    "slow: Slow tests",
    "gpu: Tests requiring GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:transformers",
    "ignore::UserWarning:torch",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/__main__.py",
    "tests/*",
    "*/conftest.py",
]
branch = true
parallel = true
concurrency = ["thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pre-commit-hooks]
hooks = [
    {id = "trailing-whitespace"},
    {id = "end-of-file-fixer"},
    {id = "check-yaml"},
    {id = "check-added-large-files", args = ["--maxkb=500"]},
    {id = "check-merge-conflict"},
    {id = "debug-statements"},
    {id = "ruff", args = ["check", "--fix", "."]},
    {id = "ruff-format", args = ["format", "."]},
    {id = "mypy", args = ["src"]},
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pyupgrade]
py310-plus = true
keep-runtime-typing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "env"]
skip = ["B101", "B601"]

[tool.pip-audit]
descend = true
skip = ["bitsandbytes"]

[tool.commitizen]
version = "1.0.0"
version_files = [
    "pyproject.toml",
    "src/__init__.py",
]
style = "conventional"
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
changelog_incremental = true

[tool.hatch.build.hooks.uv]
dev-dependencies = ["dev"]
dependencies = []

[tool.uv]
dev-dependencies = {dev = ["dev"]}