name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  release:
    types: [published, prereleased]
  schedule:
    - cron: '0 0 * * 0'  # Weekly security scan

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install ruff

      - name: Run Ruff lint
        run: ruff check src/ tests/

      - name: Run Ruff format check
        run: ruff format --check src/ tests/

      - name: Run isort check
        run: |
          pip install isort
          isort --check-only --profile black src/ tests/

      - name: Run Black check
        run: |
          pip install black
          black --check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy

      - name: Run mypy
        run: mypy src/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-cov pytest-mock pytest-asyncio pytest-xdist

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml:coverage-unit.xml --cov-fail-under=90 -n auto

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-unit.xml
          flags: unit
          fail_ci_if_error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-cov pytest-mock

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml:coverage-integration.xml --cov-fail-under=80

      - name: Upload integration coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-integration.xml
          flags: integration

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: |
          pytest tests/smoke/ -v --tb=short

  pipeline-tests:
    name: Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-cov

      - name: Run pipeline tests
        run: |
          pytest tests/pipeline/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml:coverage-pipeline.xml --cov-fail-under=70

      - name: Upload pipeline coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-pipeline.xml
          flags: pipeline

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pip-audit safety

      - name: Run pip-audit
        run: |
          pip-audit --desc --format=json --output=pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      - name: Run Safety
        run: |
          safety check --json --output=safety-report.json || true

      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 30

      - name: Check for vulnerabilities
        run: |
          if [ -f pip-audit-report.json ]; then
            VULNS=$(jq '.vulnerabilities | length' pip-audit-report.json 2>/dev/null || echo 0)
            if [ "$VULNS" -gt 0 ]; then
              echo "::warning::Found $VULNS vulnerabilities in dependencies"
              jq -r '.vulnerabilities[] | "\(.package) \(.installed_version) - \(.vulnerabilities[].id): \(.vulnerabilities[].description)"' pip-audit-report.json
            fi
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit -r src/ -f json -o bandit-report.json -ll || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      - name: Upload Bandit results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-report.json
          category: bandit

      - name: Check for high severity issues
        run: |
          if [ -f bandit-report.json ]; then
            HIGH=$(jq '.results | map(select(.severity == "HIGH")) | length' bandit-report.json 2>/dev/null || echo 0)
            if [ "$HIGH" -gt 0 ]; then
              echo "::error::Found $HIGH high severity security issues"
              jq -r '.results[] | select(.severity == "HIGH") | "\(.filename):\(.line_number) - \(.issue_text)"' bandit-report.json
              exit 1
            fi
          fi

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --json --no-verification --fail

      - name: Run detect-secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --exclude-files ".*\.lock$" > .secrets.baseline || true
          if [ -s .secrets.baseline ]; then
            cat .secrets.baseline
            exit 1
          fi

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Scan Docker image
        if: github.event_name == 'push'
        run: |
          pip install dockerfile
          # Basic Dockerfile linting
          dockerfile_lint Dockerfile || true

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Verify package
        run: |
          twine check dist/*

      - name: Upload to PyPI
        if: github.event.release.prerelease == false
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

      - name: Upload to TestPyPI
        if: github.event.release.prerelease == true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          twine upload --repository testpypi dist/*

      - name: Create GitHub Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          retention-days: 90

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, unit-tests, integration-tests, smoke-tests, pipeline-tests, dependency-scan, security-scan, build-docker]
    if: always()
    steps:
      - name: Check job status
        run: |
          echo "Job statuses:"
          echo "lint-and-format: ${{ needs.lint-and-format.result }}"
          echo "type-check: ${{ needs.type-check.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "integration-tests: ${{ needs.integration-tests.result }}"
          echo "smoke-tests: ${{ needs.smoke-tests.result }}"
          echo "pipeline-tests: ${{ needs.pipeline-tests.result }}"
          echo "dependency-scan: ${{ needs.dependency-scan.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"
          echo "build-docker: ${{ needs.build-docker.result }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::CI pipeline failed!"
          # Add Slack/Discord/Email notification here
          # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"CI failed for ${{ github.repository }}"}' $SLACK_WEBHOOK_URL