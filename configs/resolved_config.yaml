      target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      bias: none
      task_type: CAUSAL_LM
      inference_mode: false
      layers_to_transform: null
      layers_pattern: null
      rank_pattern: {}
      alpha_pattern: {}
      megatron_config: null
      megatron_core: false
      lora_plus_scale: null
      lora_plus_lr_ratio: null
    adalora:
      target_r: 8
      init_r: 12
      tinit: 0
      tfinal: 0
      deltaT: 10
      beta1: 0.85
      beta2: 0.85
      orth_reg_weight: 0.5
      total_step: null
      rank_pattern: {}
      alpha_pattern: {}
    ia3:
      target_modules: []
      feedforward_modules: []
      fan_in_fan_out: false
      init_ia3_weights: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_use_double_quant: true
    bnb_4bit_quant_storage: uint8
    load_in_8bit: false
    llm_int8_threshold: 6.0
    llm_int8_has_fp16_weight: false
    llm_int8_skip_modules: []
    llm_int8_enable_fp32_cpu_offload: false
    quantization_config_class: BitsAndBytesConfig
    bnb_4bit_quant_storage_dtype: uint8
  loading:
    revision: main
    token: null
    use_auth_token: true
    cache_dir: null
    force_download: false
    resume_download: null
    proxies: null
    local_files_only: false
    offload_folder: ./offload
    offload_state_dict: false
    offload_buffers: false
    max_memory: null
    low_cpu_mem_usage: true
    use_safetensors: true
    variant: null
    torch_dtype: bfloat16
    device_map: auto
    attn_implementation: flash_attention_2
    use_flash_attention_2: true
    gradient_checkpointing: true
    load_in_8bit: false
    load_in_4bit: true
    peft_config: null
    is_trainable: true
  saving:
    save_adapter: true
    adapter_path: ./adapters/best
    save_tokenizer: true
    merge_and_unload: false
    merged_model_path: ./artifacts/models/merged/v1.0.0
    merged_dtype: bfloat16
    safe_serialization: true
    max_shard_size: 5GB
    push_to_hub: false
    hub_model_id: ''
    hub_private_repo: false
    hub_token: null
